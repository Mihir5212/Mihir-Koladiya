  <script>
    // Work out the site root so links work on Vercel ("/") and in a local preview ("/Mihir's Portfolio/")
    (function () {
      var path = decodeURIComponent(location.pathname);
      var i = path.indexOf("/Mihir's Portfolio/");
      var root = i >= 0 ? path.slice(0, i) + "/Mihir's Portfolio/" : "/";
      document.write('<base href="' + encodeURI(root) + '">');
    })();
  </script>

  <style>
    body { margin: 0; background: #F7F5F0; }
    .nf { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .nf__card { position: relative; width: 100%; max-width: 760px; overflow: hidden; padding: 56px 48px 48px; border-radius: 28px; background: #14182B; color: #fff; box-shadow: 0 30px 60px -36px rgba(20,24,43,.7); }
    .nf__big { position: absolute; right: -10px; bottom: -40px; font-family: var(--font-display, serif); font-size: clamp(9rem, 26vw, 15rem); line-height: 1; color: rgba(255,255,255,.05); pointer-events: none; user-select: none; }
    .nf__label { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-mono, monospace); font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: #E9C95A; }
    .nf__label::before { content: ""; width: 28px; height: 2px; background: #C9A227; }
    .nf h1 { position: relative; margin: 16px 0 12px; font-family: var(--font-display, serif); font-weight: 400; font-size: clamp(2rem, 4.6vw, 2.9rem); line-height: 1.15; color: #fff; }
    .nf p { position: relative; max-width: 480px; margin: 0 0 30px; font-size: 1rem; line-height: 1.7; color: rgba(255,255,255,.72); }
    .nf__actions { position: relative; display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 36px; }
    .nf__btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 999px; font-weight: 600; font-size: .92rem; text-decoration: none; transition: transform .2s, background .2s; }
    .nf__btn--gold { background: #E3C04A; color: #14182B; }
    .nf__btn--gold:hover { background: #F0D06A; transform: translateY(-2px); }
    .nf__btn--line { border: 1px solid rgba(255,255,255,.28); color: #fff; }
    .nf__btn--line:hover { border-color: #E3C04A; color: #E3C04A; }
    .nf__links { position: relative; display: flex; flex-wrap: wrap; gap: 8px 22px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.12); }
    .nf__links a { font-size: .86rem; color: rgba(255,255,255,.7); text-decoration: none; }
    .nf__links a:hover { color: #E3C04A; }
    @media (max-width: 560px) { .nf__card { padding: 40px 24px 32px; border-radius: 22px; } }
    .nf__card { padding-bottom: 88px; }
    .nf__site { position: absolute; right: 28px; top: 26px; width: 200px; height: auto; }
    .nf__lamp { animation: nfBlink 1.2s steps(2, start) infinite; }
    @keyframes nfBlink { to { opacity: .15; } }
    .nf__road { position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #2A3044; border-top: 3px solid #3A4160; overflow: hidden; }
    .nf__road span { position: absolute; left: 0; top: 50%; width: 200%; height: 4px; margin-top: -2px; background: repeating-linear-gradient(90deg, #E9C95A 0 34px, transparent 34px 64px); animation: nfRoad 2.4s linear infinite; }
    @keyframes nfRoad { from { transform: translateX(0); } to { transform: translateX(-64px); } }
    .nf__label, .nf h1, .nf p { max-width: calc(100% - 220px); }
    @media (max-width: 700px) {
      .nf__site { position: relative; right: auto; top: auto; display: block; width: 170px; margin: 0 0 18px; }
      .nf__label, .nf h1, .nf p { max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) { .nf__lamp, .nf__road span { animation: none; } }
  </style>
</head>
